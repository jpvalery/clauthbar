name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + commit count feed the bundle version

      - name: Build app (universal)
        env:
          UNIVERSAL: '1'
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          export VERSION="${VERSION#v}"
          scripts/build-app.sh --zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClauthBar
          path: build/ClauthBar-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ClauthBar-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
