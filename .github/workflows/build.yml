name: Build

# CI check: every push to main and every PR must produce a working app bundle.
# The zip is kept as a workflow artifact; releases are handled by release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + commit count feed the bundle version

      - name: Build app (universal)
        env:
          UNIVERSAL: '1'
        run: scripts/build-app.sh --zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClauthBar
          path: build/ClauthBar-*.zip
